name: Build e testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore GestaoViaturasAPI.Tests/GestaoViaturasAPI.Tests.csproj
      - run: dotnet build GestaoViaturasAPI.Tests/GestaoViaturasAPI.Tests.csproj --no-restore --configuration Release
      - run: dotnet test GestaoViaturasAPI.Tests/GestaoViaturasAPI.Tests.csproj --no-build --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: TestResults/*.trx
